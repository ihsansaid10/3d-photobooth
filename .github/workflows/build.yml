name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download three.js (lokal, biar app jalan offline)
        run: |
          mkdir -p www/lib
          B=https://cdn.jsdelivr.net/npm/three@0.147.0
          curl -fsSL -o www/lib/three.min.js $B/build/three.min.js
          curl -fsSL -o www/lib/OrbitControls.js $B/examples/js/controls/OrbitControls.js
          curl -fsSL -o www/lib/TransformControls.js $B/examples/js/controls/TransformControls.js
          curl -fsSL -o www/lib/OBJLoader.js $B/examples/js/loaders/OBJLoader.js
          curl -fsSL -o www/lib/GLTFLoader.js $B/examples/js/loaders/GLTFLoader.js
          curl -fsSL -o www/lib/RectAreaLightUniformsLib.js $B/examples/js/lights/RectAreaLightUniformsLib.js

      - name: Install Capacitor
        run: npm install

      - name: Buat project Android
        run: npx cap add android

      - name: Paksa landscape
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Photobooth-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
